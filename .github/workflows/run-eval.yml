name: Eval harness — golden fixture scoring

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"   # Weekly Monday 07:00 UTC

jobs:
  eval:
    name: Score golden epics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reqsmith
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install reqsmith
        run: pip install -e ".[dev]"

      - name: Run eval harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL_DRAFTING: claude-haiku-4-5-20251001
        run: python evals/run_eval.py --verbose

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-${{ github.run_id }}
          path: reqsmith/evals/reports/
          retention-days: 90
